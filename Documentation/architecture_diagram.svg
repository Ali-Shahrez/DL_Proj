<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s { font-size: 12px; text-anchor: middle; }
    .lab { font-size: 12px; fill: #888780; text-anchor: middle; }
  </style>
  <rect width="1000" height="560" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#2C2C2A">Two-head model for road damage type and severity</text>
  <text x="40" y="66" font-size="13" fill="#5F5E5A">One shared backbone, two task heads, severity loss on labeled images only</text>

  <text x="120" y="182" class="lab">Input</text>
  <text x="350" y="168" class="lab">Shared feature extractor</text>
  <text x="640" y="98" class="lab">Task heads</text>

  <!-- Input -->
  <rect x="40" y="200" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text x="120" y="230" class="h" fill="#2C2C2A">Input image</text>
  <text x="120" y="252" class="s" fill="#5F5E5A">224 × 224 RGB</text>
  <text x="40" y="308" font-size="12" fill="#5F5E5A">Training set: 4,196 images</text>
  <text x="40" y="326" font-size="12" fill="#5F5E5A">Labeled: ~400 crack and pothole</text>
  <line x1="200" y1="240" x2="250" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Backbone -->
  <rect x="250" y="180" width="200" height="120" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="350" y="216" class="h" fill="#3C3489">Shared backbone</text>
  <text x="350" y="236" class="s" fill="#534AB7">EfficientNet-B0</text>
  <text x="350" y="254" class="s" fill="#534AB7">ImageNet pretrained</text>
  <text x="350" y="272" class="s" fill="#534AB7">Output: 1,280 features</text>

  <!-- Branches -->
  <path d="M450 240 H490 V170 H530" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M450 240 H490 V390 H530" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Damage-type head -->
  <rect x="530" y="110" width="220" height="120" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="640" y="146" class="h" fill="#085041">Damage-type head</text>
  <text x="640" y="168" class="s" fill="#0F6E56">Normal · Crack · Pothole</text>
  <text x="640" y="190" class="s" fill="#0F6E56">Trained on all 4,196 images</text>
  <text x="640" y="212" class="s" fill="#0F6E56">Loss: cross-entropy</text>

  <!-- Severity head -->
  <rect x="530" y="330" width="220" height="120" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="640" y="366" class="h" fill="#633806">Severity head</text>
  <text x="640" y="388" class="s" fill="#854F0B">Low · High</text>
  <text x="640" y="410" class="s" fill="#854F0B">Trained on ~400 labeled images</text>
  <text x="640" y="432" class="s" fill="#854F0B">Loss masked for other images</text>

  <!-- Training loss -->
  <rect x="40" y="480" width="460" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text x="60" y="502" font-size="13" font-weight="600" fill="#2C2C2A">Training loss</text>
  <text x="60" y="522" font-size="12" fill="#5F5E5A">Total = L_type + 1.25 × L_sev (labeled images only)</text>

  <!-- Inference rule -->
  <rect x="520" y="480" width="440" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="540" y="502" font-size="13" font-weight="600" fill="#27500A">Inference rule</text>
  <text x="540" y="522" font-size="12" fill="#3B6D11">Show severity only if damage type is Crack or Pothole</text>
</svg>
